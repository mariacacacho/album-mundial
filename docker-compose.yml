services:
  db:
    image: postgres:16-alpine
    container_name: album-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: album
      POSTGRES_USER: album
      POSTGRES_PASSWORD: pon-aqui-tu-password-real
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U album"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: album-mundial
    restart: unless-stopped
    ports:
      - "3005:3005"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://album:pon-aqui-tu-password-real@db:5432/album
      JWT_SECRET: pon-aqui-un-string-largo-y-aleatorio
      PORT: 3005
